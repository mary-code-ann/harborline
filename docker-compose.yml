services:
  db:
    image: postgres:16-alpine
    container_name: harborline-db
    environment:
      POSTGRES_USER: harborline
      POSTGRES_PASSWORD: harborline
      POSTGRES_DB: harborline
    ports:
      - "5432:5432"
    volumes:
      - harborline_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harborline -d harborline"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  harborline_pg:
